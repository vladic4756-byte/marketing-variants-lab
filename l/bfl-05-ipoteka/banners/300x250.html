<!doctype html>
<!-- banner:bfl-05-ipoteka-300x250 · ОСТ · концепция: цитата-отзыв / мини-кейс (social-proof). Самодостаточный HTML, overflow:hidden. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=300,height=250">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden}
.b{width:300px;height:250px;background:radial-gradient(120% 120% at 85% -10%,#1a3a5e,#0E2138 55%,#0a1929);font-family:Georgia,'Times New Roman',serif;color:#fff;position:relative;padding:16px 16px 14px;display:flex;flex-direction:column}
.b::before{content:"";position:absolute;inset:8px;border:1px solid rgba(176,141,87,.5);border-radius:4px;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{font-family:Arial,sans-serif;font-weight:700;letter-spacing:.14em;font-size:12px;color:#fff}
.brand small{display:block;font-weight:400;letter-spacing:.06em;font-size:10px;color:#c9a86e;text-transform:uppercase}
.seal{width:28px;height:28px;border:1px solid #B08D57;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#c9a86e;font-size:13px}
.mid{position:relative;z-index:1;margin-top:13px}
.quote{font-style:italic;font-size:14px;line-height:1.3;color:#f2ece0}
.case{margin-top:10px;background:rgba(255,255,255,.06);border-left:2px solid #B08D57;border-radius:3px;padding:7px 9px}
.case b{font-family:Arial,sans-serif;font-size:11px;color:#fff;display:block}
.case span{font-family:Arial,sans-serif;font-size:10px;color:#8ed6ad}
.cta{position:relative;z-index:1;margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.btn{font-family:Arial,sans-serif;font-weight:700;font-size:12px;background:#B08D57;color:#fff;border-radius:4px;padding:8px 12px;white-space:nowrap}
.micro{font-family:Arial,sans-serif;font-size:10px;color:rgba(255,255,255,.5);line-height:1.15;text-align:right}
</style></head>
<body><div class="b">
  <div class="top"><div class="brand">ОСТ<small>защита жилья</small></div><div class="seal">§</div></div>
  <div class="mid">
    <div class="quote">«Думали, квартиру заберут…»</div>
    <div class="case"><b>Казань · ипотека 2,4 млн ₽</b><span>✓ мировое соглашение утверждено судом</span></div>
  </div>
  <div class="cta"><span class="btn">Оценить мой шанс</span><span class="micro">Пример.<br>Реклама · 127-ФЗ</span></div>
</div></body></html>
