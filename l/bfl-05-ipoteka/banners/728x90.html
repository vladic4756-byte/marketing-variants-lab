<!doctype html>
<!-- banner:bfl-05-ipoteka-728x90 · ОСТ · концепция: крупная цифра-оффер (цена от 49 900 ₽). Самодостаточный HTML, overflow:hidden. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=728,height=90">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden}
.b{width:728px;height:90px;background:radial-gradient(120% 300% at 12% 50%,#1a3a5e,#0E2138 60%,#0a1929);font-family:Georgia,'Times New Roman',serif;color:#fff;position:relative;display:flex;align-items:center;gap:20px;padding:0 20px}
.b::before{content:"";position:absolute;inset:6px;border:1px solid rgba(176,141,87,.45);border-radius:4px;pointer-events:none}
.z{position:relative;z-index:1}
.brand{font-family:Arial,sans-serif;font-weight:700;letter-spacing:.12em;font-size:15px;line-height:1.1;flex:0 0 auto}
.brand small{display:block;font-weight:400;letter-spacing:.05em;font-size:10px;color:#c9a86e;text-transform:uppercase}
.div{width:1px;height:52px;background:rgba(176,141,87,.4);flex:0 0 auto}
.msg{flex:1 1 auto;min-width:0}
.msg h1{font-size:19px;font-weight:700;line-height:1.15}
.msg h1 em{font-style:italic;color:#c9a86e}
.price{font-family:Arial,sans-serif;font-size:12px;color:rgba(255,255,255,.8);margin-top:3px}
.price b{color:#fff;font-weight:700}
.num{flex:0 0 auto;text-align:center;line-height:1}
.num .big{font-family:Georgia,serif;font-weight:700;font-size:27px;color:#c9a86e}
.num .lab{font-family:Arial,sans-serif;font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.05em}
.btn{flex:0 0 auto;font-family:Arial,sans-serif;font-weight:700;font-size:13px;background:#B08D57;color:#fff;border-radius:4px;padding:11px 16px;white-space:nowrap}
.micro{position:absolute;right:10px;bottom:3px;z-index:1;font-family:Arial,sans-serif;font-size:10px;color:rgba(255,255,255,.4)}
</style></head>
<body><div class="b">
  <div class="z brand">ОСТ<small>защита жилья</small></div>
  <div class="z div"></div>
  <div class="z msg">
    <h1>Сохранить <em>ипотечную квартиру</em> через суд</h1>
    <div class="price">Мировое соглашение или реструктуризация · <b>рассрочка до 10 мес</b></div>
  </div>
  <div class="z num"><div class="big">от 49 900 ₽</div><div class="lab">по остатку ипотеки</div></div>
  <div class="z btn">Оценить шанс</div>
  <div class="micro">Реклама · результат зависит от суда · 127-ФЗ</div>
</div></body></html>
