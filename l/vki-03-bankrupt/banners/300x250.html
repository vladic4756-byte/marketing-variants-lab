<!doctype html>
<!-- banner:vki-03-bankrupt-300x250 · ЗАНОВО · S2 «После банкротства» · КОНЦЕПЦИЯ: до→после. Редакционный (paper/serif), самодостаточный, инлайн. -->
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=300, initial-scale=1"/>
<title>ЗАНОВО 300x250</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:300px;height:250px;overflow:hidden;background:#FBF8F1;
    font-family:-apple-system,'Segoe UI',system-ui,Arial,sans-serif}
  .b{position:relative;width:300px;height:250px;background:#FBF8F1;color:#1C1B18;padding:14px 16px;
    display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:baseline;justify-content:space-between}
  .brand{font-family:Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.04em;color:#134E4A}
  .adk{font-size:7.5px;letter-spacing:.06em;color:#9c988c;text-transform:uppercase}
  .ba{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .row{border-radius:7px;padding:8px 10px;line-height:1.15}
  .was{background:#F4EDE2;border:1px solid #E3DCCC}
  .was .lab{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#9A3412;font-weight:700}
  .was .t{font-size:14px;color:#6b675e;font-weight:600;margin-top:2px}
  .now{background:#EAF3F1;border:1px solid #CFE3DF}
  .now .lab{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#0F766E;font-weight:700}
  .now .t{font-family:Georgia,serif;font-size:16px;color:#134E4A;font-weight:700;margin-top:2px;line-height:1.1}
  .now .t b{color:#134E4A}
  .arrow{align-self:center;font-size:13px;color:#F0A94C;font-weight:700;line-height:.6;margin:-2px 0}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
  .cta{background:#F0A94C;color:#3A2607;font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:8px;white-space:nowrap}
  .fine{font-size:7.5px;color:#9c988c;line-height:1.25}
</style>
</head>
<body>
<div class="b">
  <div class="top"><span class="brand">ЗАНОВО</span><span class="adk">на правах рекламы</span></div>
  <div class="ba">
    <div class="row was"><div class="lab">Было</div><div class="t">Отказ. Отказ. Снова отказ.</div></div>
    <div class="arrow">▼</div>
    <div class="row now"><div class="lab">Стало</div><div class="t"><b>+150–400 баллов</b> за 6–9 мес</div></div>
  </div>
  <div class="foot">
    <span class="cta">Как это работает →</span>
    <span class="fine">По договору.<br>Решение — за банком.</span>
  </div>
</div>
</body>
</html>
