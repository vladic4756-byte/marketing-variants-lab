<!doctype html>
<!-- Баннер 728×90 · ЛЕГЧЕ · БФЛ постоплата · угол «платите после подачи» · мокап (HTML/CSS) -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  *{margin:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
  .b{width:728px;height:90px;overflow:hidden;position:relative;color:#fff;display:flex;align-items:center;gap:18px;
     background:linear-gradient(100deg,#134E48 0%,#1a655b 60%,#1b6b60 100%);padding:0 20px;border-radius:12px}
  .brand{font-weight:700;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .mark{width:26px;height:26px;border-radius:7px;background:#fff;color:#134E48;display:grid;place-items:center;font-weight:700}
  h1{font-size:20px;line-height:1.12;font-weight:700;flex:0 0 auto;max-width:300px;letter-spacing:-.01em}
  h1 b{color:#F0A05A}
  .pay{display:flex;gap:8px;flex:0 0 auto}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:6px 11px;text-align:center}
  .chip b{display:block;font-size:15px;color:#8fe6c2}
  .chip.o b{color:#F0A05A}
  .chip span{font-size:8.5px;color:#cbe2dd}
  .cta{margin-left:auto;flex:0 0 auto;background:#F0A05A;color:#2c1600;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;white-space:nowrap}
  .disc{position:absolute;left:0;bottom:0;width:100%;font-size:6px;line-height:1.2;color:#9dbeb7;padding:2px 20px;background:rgba(0,0,0,.16)}
</style></head><body>
<div class="b">
  <div class="brand"><span class="mark">Л</span> ЛЕГЧЕ</div>
  <h1>Банкротство: <b>платите после подачи</b></h1>
  <div class="pay">
    <div class="chip o"><b>10%</b><span>при подаче</span></div>
    <div class="chip"><b>90%</b><span>рассрочка 8 мес</span></div>
  </div>
  <div class="cta">Узнать условия →</div>
  <div class="disc">Реклама услуг сопровождения банкротства (ФЗ-127). Освобождение от долгов — по решению суда, не во всех случаях (ст. 213.28, 28.1 ФЗ). Постоплата — график платежей, не бесплатность.</div>
</div>
</body></html>
