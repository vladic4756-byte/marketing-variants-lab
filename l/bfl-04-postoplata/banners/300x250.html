<!doctype html>
<!-- Баннер 300×250 · ЛЕГЧЕ · БФЛ постоплата · угол «платите после подачи» · мокап (HTML/CSS) -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  *{margin:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
  .b{width:300px;height:250px;overflow:hidden;position:relative;color:#fff;
     background:linear-gradient(160deg,#134E48 0%,#1a655b 70%,#1b6b60 100%);padding:18px 18px 0;border-radius:14px}
  .brand{font-weight:700;font-size:14px;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
  .mark{width:22px;height:22px;border-radius:6px;background:#fff;color:#134E48;display:grid;place-items:center;font-weight:700}
  h1{font-size:21px;line-height:1.14;font-weight:700;margin:12px 0 8px;letter-spacing:-.01em}
  h1 b{color:#F0A05A}
  .pay{display:flex;gap:6px;margin:6px 0 0}
  .chip{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:6px 8px}
  .chip b{display:block;font-size:16px;color:#8fe6c2}
  .chip span{font-size:9px;color:#cbe2dd}
  .cta{position:absolute;left:18px;bottom:26px;background:#F0A05A;color:#2c1600;font-weight:700;
       font-size:13px;padding:9px 16px;border-radius:999px}
  .disc{position:absolute;left:0;bottom:0;width:100%;font-size:6.5px;line-height:1.25;color:#9dbeb7;
        padding:4px 18px;background:rgba(0,0,0,.18)}
</style></head><body>
<div class="b">
  <div class="brand"><span class="mark">Л</span> ЛЕГЧЕ</div>
  <h1>Банкротство: <b>платите после подачи</b> заявления</h1>
  <div class="pay">
    <div class="chip"><b>10%</b><span>при подаче в суд</span></div>
    <div class="chip"><b>90%</b><span>рассрочка 8 мес</span></div>
  </div>
  <div class="cta">Узнать условия →</div>
  <div class="disc">Реклама услуг сопровождения банкротства (ФЗ-127). Освобождение от долгов — по решению суда, не во всех случаях (ст. 213.28, 28.1 ФЗ). Постоплата — график платежей, не бесплатность.</div>
</div>
</body></html>
