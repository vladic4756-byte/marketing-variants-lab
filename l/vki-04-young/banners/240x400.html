<!doctype html>
<!-- banner:vki-04-young 240x400 · СТАРТ · «одна ошибка ≠ приговор» · мокап РСЯ, самодостаточный HTML -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0}
  .b{width:240px;height:400px;box-sizing:border-box;position:relative;overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;color:#f5f3ff;
    background:radial-gradient(110% 60% at 80% 0%,rgba(217,70,239,.32),transparent 55%),linear-gradient(180deg,#0c0a1e,#180f3a 70%,#0c0a1e);
    padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#d946ef);
    display:grid;place-items:center;font-style:normal;font-size:16px}
  h1{margin:14px 0 0;font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
  h1 b{background:linear-gradient(120deg,#a78bfa,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:12px 0 0;font-size:13px;line-height:1.4;color:#cfc7ee}
  .gauge{margin:16px 0 0;height:8px;border-radius:999px;background:linear-gradient(90deg,#dc2626,#f59e0b,#22c55e,#059669);position:relative}
  .gauge span{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #8b5cf6;left:78%}
  .glabel{margin-top:6px;font-size:10px;color:#8b84ad}
  .cta{margin-top:14px;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;
    font-weight:700;font-size:14px;text-align:center;padding:13px;border-radius:999px}
  .fine{margin-top:9px;font-size:8px;color:#8b84ad;line-height:1.3}
</style></head>
<body>
  <div class="b">
    <div>
      <div class="brand"><i>С</i>СТАРТ</div>
      <h1>Одна ошибка молодости — <b>не на всю жизнь</b></h1>
      <p>Из-за одной просрочки везде отказ? Законно поднимем кредитный рейтинг.</p>
      <div class="gauge" aria-hidden="true"><span></span></div>
      <div class="glabel">рост рейтинга под одобрения</div>
    </div>
    <div>
      <div class="cta">Узнать свой прогноз →</div>
      <div class="fine">По договору. +150–400 баллов за 6–9 мес или возврат 100% стоимости при выполнении рекомендаций. Старт от 14 900 ₽.</div>
    </div>
  </div>
</body></html>
