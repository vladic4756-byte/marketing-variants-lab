<!doctype html>
<!-- banner:vki-04-young 240x400 · концепция ДО→ПОСЛЕ (динамика рейтинга: отказ → одобрения) -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:240px;height:400px;overflow:hidden}
.b{width:240px;height:400px;position:relative;overflow:hidden;
  font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#f3f1fb;
  background:radial-gradient(22rem 20rem at 50% -8%,#3a2870 0%,transparent 62%),#0c0a1e;padding:16px 15px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.ava{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#d946ef);display:grid;place-items:center;font-weight:800;font-size:.7rem;color:#fff}
.brand span{font-size:.72rem;font-weight:700}
.h{font-size:1.12rem;font-weight:800;line-height:1.18;letter-spacing:-.01em;margin-bottom:14px}
.h b{background:linear-gradient(135deg,#8b5cf6,#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cmp{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.card{border-radius:12px;padding:9px 11px}
.card--was{background:#1a1636;border:1px solid rgba(255,255,255,.08)}
.card--now{background:linear-gradient(150deg,rgba(139,92,246,.2),rgba(217,70,239,.1));border:1px solid rgba(167,139,250,.45)}
.lbl{font-size:.56rem;color:#a49dcb;letter-spacing:.06em;text-transform:uppercase}
.num{font-size:1.5rem;font-weight:800;line-height:1.05}
.num--was{color:#9a93bf}
.num--now{background:linear-gradient(135deg,#8b5cf6,#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:.6rem;color:#a49dcb;margin-top:1px}
.arrow{text-align:center;font-size:.9rem;color:#a78bfa;margin:-3px 0}
.cta{margin-top:auto;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;border-radius:999px;padding:10px;text-align:center;font-size:.82rem;font-weight:700}
.dis{font-size:.47rem;color:#8a83b0;margin-top:8px;line-height:1.25}
</style></head>
<body><div class="b">
  <div class="brand"><div class="ava">С</div><span>СТАРТ</span></div>
  <div class="h">Испортил историю по молодости? <b>Ещё не приговор.</b></div>
  <div class="cmp">
    <div class="card card--was"><div class="lbl">было</div><div class="num num--was">480</div><div class="sub">отказ по карте и рассрочке</div></div>
    <div class="arrow">↓</div>
    <div class="card card--now"><div class="lbl">цель по договору</div><div class="num num--now">700+</div><div class="sub">рейтинг для одобрений</div></div>
  </div>
  <div class="cta">Узнать прогноз →</div>
  <div class="dis">+150–400 баллов за 6–9 мес или возврат — при выполнении рекомендаций. Законно, историю не удаляем.</div>
</div></body></html>
