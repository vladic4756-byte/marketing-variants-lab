<!doctype html>
<!-- banner:vki-04-young 728x90 · СТАРТ · «одна ошибка ≠ приговор» · мокап РСЯ, самодостаточный HTML -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0}
  .b{width:728px;height:90px;box-sizing:border-box;position:relative;overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;color:#f5f3ff;
    background:radial-gradient(60% 200% at 92% 50%,rgba(217,70,239,.32),transparent 60%),linear-gradient(90deg,#0c0a1e,#180f3a);
    padding:0 22px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;flex:0 0 auto}
  .brand i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#d946ef);
    display:grid;place-items:center;font-style:normal;font-size:18px}
  .txt{flex:1 1 auto;min-width:0}
  h1{margin:0;font-size:21px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  h1 b{background:linear-gradient(120deg,#a78bfa,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:3px 0 0;font-size:11px;color:#cfc7ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cta{flex:0 0 auto;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;
    font-weight:700;font-size:13px;text-align:center;padding:12px 20px;border-radius:999px;white-space:nowrap}
</style></head>
<body>
  <div class="b">
    <div class="brand"><i>С</i>СТАРТ</div>
    <div class="txt">
      <h1>Одна просрочка — <b>не приговор</b>. Исправим законно</h1>
      <p>Рост рейтинга +150–400 баллов за 6–9 мес или возврат стоимости · по договору · старт от 14 900 ₽</p>
    </div>
    <div class="cta">Узнать прогноз →</div>
  </div>
</body></html>
