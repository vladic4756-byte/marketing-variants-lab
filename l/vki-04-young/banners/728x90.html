<!doctype html>

<html lang="ru"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden}
.b{width:728px;height:90px;overflow:hidden;display:flex;align-items:center;gap:14px;padding:0 18px;
  font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#f3f1fb;
  background:radial-gradient(30rem 10rem at 10% 50%,#3a2870 0%,transparent 60%),#0c0a1e}
.ava{width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#d946ef);display:grid;place-items:center;font-weight:800;font-size:1rem;color:#fff}

.brand{font-size:.58rem;color:#a49dcb;letter-spacing:.08em;text-transform:uppercase}
.h{font-size:.92rem;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.h b{background:linear-gradient(135deg,#8b5cf6,#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.dis{font-size:.5rem;color:#8a83b0;line-height:1.15;margin-top:2px}
.price{flex:0 0 auto;text-align:center}
.price .lbl{font-size:.54rem;color:#a49dcb}
.price .big{font-size:1.35rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#8b5cf6,#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.cta{flex:0 0 auto;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;border-radius:999px;padding:10px 16px;font-size:.82rem;font-weight:700;white-space:nowrap}
</style></head>
<body><div class="b">
  <div class="ava">С</div>
  <div class="txt">
    <div class="brand">СТАРТ · кредитная реабилитация</div>

    <div class="dis">Рост рейтинга по договору при выполнении рекомендаций. Историю не удаляем.</div>
  </div>
  <div class="price"><div class="lbl">старт с разбора</div><div class="big">от 14 900 ₽</div></div>
  <div class="cta">Пройти разбор →</div>
</div></body></html>
