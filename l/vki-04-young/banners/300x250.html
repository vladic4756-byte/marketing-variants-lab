<!doctype html>
<!-- banner:vki-04-young 300x250 · СТАРТ · «одна ошибка ≠ приговор» · мокап РСЯ, самодостаточный HTML -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0}
  .b{width:300px;height:250px;box-sizing:border-box;position:relative;overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;color:#f5f3ff;
    background:radial-gradient(120% 90% at 85% -10%,rgba(217,70,239,.35),transparent 55%),linear-gradient(160deg,#0c0a1e,#1a1140);
    padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;letter-spacing:.02em}
  .brand i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#8b5cf6,#d946ef);
    display:grid;place-items:center;font-style:normal;font-size:15px}
  h1{margin:8px 0 0;font-size:23px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
  h1 b{background:linear-gradient(120deg,#a78bfa,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:6px 0 0;font-size:12px;line-height:1.35;color:#cfc7ee}
  .cta{margin-top:12px;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;
    font-weight:700;font-size:13px;text-align:center;padding:11px;border-radius:999px}
  .fine{margin-top:7px;font-size:8px;color:#8b84ad;line-height:1.3}
</style></head>
<body>
  <div class="b">
    <div>
      <div class="brand"><i>С</i>СТАРТ</div>
      <h1>Одна просрочка — <b>не приговор</b></h1>
      <p>Исправим кредитную историю быстро и законно. Рост рейтинга или возврат стоимости.</p>
    </div>
    <div>
      <div class="cta">Узнать свой прогноз →</div>
      <div class="fine">По договору. +150–400 баллов за 6–9 мес или возврат 100% стоимости при выполнении рекомендаций.</div>
    </div>
  </div>
</body></html>
