<!doctype html>
<!-- Баннер РЕЙТУМ · vki-01-ipoteka · 300x250 · угол «Гарантия под одобрение ипотеки» -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0}
  .b{width:300px;height:250px;box-sizing:border-box;position:relative;overflow:hidden;
     font-family:'Segoe UI',Arial,sans-serif;color:#fff;
     background:radial-gradient(120% 120% at 85% 0%,#1b346f,#0F1E4D 60%);padding:18px 18px 16px}
  .b::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;
     background:radial-gradient(circle,rgba(34,184,207,.28),transparent 65%)}
  .brand{font-weight:700;font-size:13px;letter-spacing:.12em;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
  .brand i{width:20px;height:20px;border-radius:5px;background:#0F1E4D;color:#22B8CF;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;box-shadow:0 0 0 1.5px #22B8CF}
  .ribbon{position:relative;z-index:1;margin-top:12px;display:inline-block;font-size:10px;font-weight:600;
     background:rgba(34,184,207,.15);border:1px solid rgba(34,184,207,.5);color:#bfeef6;border-radius:999px;padding:3px 9px}
  h1{position:relative;z-index:1;font-size:20px;line-height:1.12;margin:9px 0 0;letter-spacing:-.02em}
  .accent{color:#37D0E6}
  .cap{position:relative;z-index:1;font-size:10.5px;color:#b9c6ea;margin:8px 0 0;line-height:1.35}
  .cta{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;text-align:center;font-weight:700;font-size:14px;
     color:#fff;background:linear-gradient(135deg,#2E6BE6,#22B8CF);border-radius:10px;padding:11px 8px;box-shadow:0 8px 18px -6px rgba(34,184,207,.6)}
</style></head>
<body>
<div class="b">
  <div class="brand"><i>Р</i>РЕЙТУМ</div>
  <span class="ribbon">Гарантия: рост или возврат</span>
  <h1>Кредитный рейтинг <span class="accent">под ипотеку</span></h1>
  <div class="cap">Законно +150–400 баллов за 6–9 мес. или вернём стоимость. Решение по ипотеке — за банком.</div>
  <div class="cta">Узнать прогноз по рейтингу</div>
</div>
</body></html>
