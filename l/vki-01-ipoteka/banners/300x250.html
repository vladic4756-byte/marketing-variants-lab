<!doctype html>
<!-- РЕЙТУМ · vki-01-ipoteka · 300x250 · КОНЦЕПЦИЯ: крупная цифра-оффер -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=300,height=250">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden}
.ad{width:300px;height:250px;overflow:hidden;position:relative;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:radial-gradient(120% 90% at 85% -10%,#20408f 0%,#0F1E4D 60%,#0a1636 100%);color:#eaf0ff;
  padding:17px 18px 15px;display:flex;flex-direction:column;justify-content:space-between}
.ad::after{content:"";position:absolute;inset:auto -30% -50% 55%;height:180px;
  background:radial-gradient(closest-side,rgba(34,184,207,.32),transparent);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#22B8CF;font-weight:700}
.big{font-family:Georgia,serif;font-weight:700;color:#fff;font-size:42px;line-height:.95;letter-spacing:-.02em;margin-top:5px}
.big small{font-size:15px;color:#cdd8f5;font-weight:400;font-family:-apple-system,Arial,sans-serif}
.sub{font-size:12px;color:#cdd8f5;line-height:1.3;margin-top:6px;position:relative;z-index:1}
.sub b{color:#fff}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(135deg,#2E6BE6,#22B8CF);color:#fff;font-weight:700;font-size:12.5px;
  padding:10px 12px;border-radius:10px;position:relative;z-index:1}
.cta span{white-space:nowrap}
.note{font-size:10px;color:#93a3d0;margin-top:6px;line-height:1.2}
</style></head>
<body>
<div class="ad">
  <div>
    <div class="eyebrow">Кредитный рейтинг под ипотеку</div>
    <div class="big">+150–400<small> баллов</small></div>
    <div class="sub">за 6–9 месяцев — <b>или вернём 100% стоимости</b>. Законно, по договору.</div>
  </div>
  <div class="cta"><span>Узнать прогноз по рейтингу</span><span>&rarr;</span></div>
  <div class="note">Решение по ипотеке принимает банк. Результат индивидуален.</div>
</div>
</body></html>
