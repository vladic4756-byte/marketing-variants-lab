<!doctype html>

<html lang="ru"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0}
  .b{width:728px;height:90px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;align-items:center;gap:18px;

  h1{font-size:19px;line-height:1.1;margin:0;letter-spacing:-.02em}
  .accent{color:#37D0E6}
  .cap{font-size:10.5px;color:#b9c6ea;margin:4px 0 0}
  .cta{position:relative;z-index:1;flex:0 0 auto;text-align:center;font-weight:700;font-size:14px;white-space:nowrap;
     color:#fff;background:linear-gradient(135deg,#2E6BE6,#22B8CF);border-radius:10px;padding:12px 18px;box-shadow:0 8px 18px -6px rgba(34,184,207,.6)}
</style></head>
<body>
<div class="b">
  <div class="brand"><i>Р</i>РЕЙТУМ</div>
  <div class="mid">
    <h1>Кредитный рейтинг <span class="accent">под одобрение ипотеки</span> — законно</h1>
    <div class="cap">+150–400 баллов за 6–9 мес. по договору или вернём стоимость. Решение по ипотеке — за банком.</div>
  </div>
  <div class="cta">Узнать прогноз</div>
</div>
</body></html>
