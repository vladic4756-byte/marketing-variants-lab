<!doctype html>
<!-- РЕЙТУМ · vki-01-ipoteka · 728x90 · КОНЦЕПЦИЯ: чек-лист -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=728,height=90">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden}
.ad{width:728px;height:90px;overflow:hidden;position:relative;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:radial-gradient(120% 200% at 90% 50%,#20408f 0%,#0F1E4D 55%,#0a1636 100%);color:#eaf0ff;
  display:flex;align-items:center;gap:18px;padding:0 20px}
.left{flex:0 0 auto;max-width:246px}
.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#22B8CF;font-weight:700}
.h{font-family:Georgia,serif;font-weight:700;color:#fff;font-size:17px;line-height:1.1;margin-top:3px}
.checks{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;min-width:0}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:#dbe4fb;white-space:nowrap}
.chk .b{flex:0 0 auto;width:16px;height:16px;border-radius:5px;background:rgba(34,184,207,.18);
  display:flex;align-items:center;justify-content:center}
.chk .b svg{display:block}
.chk b{color:#fff;font-weight:600}
.right{flex:0 0 auto;text-align:center}
.cta{background:linear-gradient(135deg,#2E6BE6,#22B8CF);color:#fff;font-weight:700;font-size:13px;
  padding:11px 16px;border-radius:10px;white-space:nowrap}
.note{font-size:10px;color:#93a3d0;margin-top:5px}
</style></head>
<body>
<div class="ad">
  <div class="left">
    <div class="eyebrow">Кредитный рейтинг под ипотеку</div>
    <div class="h">Просрочку закрыли, а в ипотеке отказывают?</div>
  </div>
  <div class="checks">
    <div class="chk"><span class="b"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#22B8CF" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span><span>Законно <b>+150–400 баллов</b> за 6–9 мес.</span></div>
    <div class="chk"><span class="b"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#22B8CF" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span><span>Рост рейтинга <b>или возврат 100%</b></span></div>
    <div class="chk"><span class="b"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#22B8CF" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span><span>По договору · оплата по этапам</span></div>
  </div>
  <div class="right">
    <div class="cta">Узнать прогноз &rarr;</div>
    <div class="note">Решение — за банком</div>
  </div>
</div>
</body></html>
