<!doctype html>
<!-- Баннер РЕЙТУМ · vki-01-ipoteka · 240x400 · угол «Гарантия под одобрение ипотеки» -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
  html,body{margin:0}
  .b{width:240px;height:400px;box-sizing:border-box;position:relative;overflow:hidden;
     font-family:'Segoe UI',Arial,sans-serif;color:#fff;
     background:radial-gradient(120% 90% at 80% 0%,#1b346f,#0F1E4D 60%);padding:20px 18px}
  .b::after{content:"";position:absolute;right:-50px;top:120px;width:220px;height:220px;border-radius:50%;
     background:radial-gradient(circle,rgba(34,184,207,.22),transparent 65%)}
  .brand{font-weight:700;font-size:13px;letter-spacing:.12em;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
  .brand i{width:20px;height:20px;border-radius:5px;background:#0F1E4D;color:#22B8CF;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;box-shadow:0 0 0 1.5px #22B8CF}
  .ribbon{position:relative;z-index:1;margin-top:16px;display:inline-block;font-size:10px;font-weight:600;
     background:rgba(34,184,207,.15);border:1px solid rgba(34,184,207,.5);color:#bfeef6;border-radius:999px;padding:3px 9px}
  h1{position:relative;z-index:1;font-size:23px;line-height:1.12;margin:12px 0 0;letter-spacing:-.02em}
  .accent{color:#37D0E6}
  /* мини-шкала рейтинга */
  .gauge{position:relative;z-index:1;margin:20px auto 0;width:150px}
  .big{position:relative;z-index:1;text-align:center;font-weight:700;font-size:26px;color:#37D0E6;margin-top:14px;letter-spacing:-.02em}
  .biglbl{position:relative;z-index:1;text-align:center;font-size:11px;color:#b9c6ea;margin-top:2px}
  .cap{position:absolute;left:18px;right:18px;bottom:74px;z-index:1;font-size:10px;color:#9db0dd;line-height:1.35;text-align:center}
  .cta{position:absolute;left:18px;right:18px;bottom:18px;z-index:1;text-align:center;font-weight:700;font-size:14px;
     color:#fff;background:linear-gradient(135deg,#2E6BE6,#22B8CF);border-radius:10px;padding:12px 8px;box-shadow:0 8px 18px -6px rgba(34,184,207,.6)}
</style></head>
<body>
<div class="b">
  <div class="brand"><i>Р</i>РЕЙТУМ</div>
  <span class="ribbon">Гарантия: рост или возврат</span>
  <h1>Рейтинг <span class="accent">под одобрение ипотеки</span></h1>
  <div class="gauge">
    <svg viewBox="0 0 320 180" width="150">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#DC2626"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#22C55E"/>
      </linearGradient></defs>
      <path d="M25 165 A135 135 0 0 1 295 165" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="20" stroke-linecap="round"/>
      <path d="M25 165 A135 135 0 0 1 258 92" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="big">+150–400</div>
  <div class="biglbl">баллов за 6–9 месяцев по договору</div>
  <div class="cap">Законно, по договору. Деньги не идут вам на руки. Решение по ипотеке — за банком.</div>
  <div class="cta">Узнать прогноз по рейтингу</div>
</div>
</body></html>
