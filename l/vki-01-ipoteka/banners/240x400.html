<!doctype html>
<!-- РЕЙТУМ · vki-01-ipoteka · 240x400 · КОНЦЕПЦИЯ: до → после (рост рейтинга) -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=240,height=400">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:240px;height:400px;overflow:hidden}
.ad{width:240px;height:400px;overflow:hidden;position:relative;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#0F1E4D 0%,#152A66 55%,#0a1636 100%);color:#eaf0ff;
  padding:18px 17px 15px;display:flex;flex-direction:column}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#22B8CF;font-weight:700}
.h{font-family:Georgia,serif;font-weight:700;color:#fff;font-size:19px;line-height:1.15;margin-top:8px}
.stage{margin-top:16px}
.lbl{display:flex;justify-content:space-between;font-size:10px;color:#c3cfef;margin-bottom:4px}
.lbl b{color:#fff}
.track{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.fill-bad{height:100%;width:32%;border-radius:99px;background:linear-gradient(90deg,#e0a44b,#d67b3c)}
.fill-good{height:100%;width:82%;border-radius:99px;background:linear-gradient(90deg,#2E6BE6,#22B8CF)}
.arrow{text-align:center;color:#22B8CF;font-size:20px;margin:9px 0 3px;font-weight:700}
.tag{display:inline-block;font-size:10px;color:#0F1E4D;background:#22B8CF;font-weight:700;border-radius:99px;padding:3px 8px;margin-top:2px}
.guar{margin-top:14px;font-size:12px;color:#dbe4fb;line-height:1.35}
.guar b{color:#fff}
.cta{margin-top:auto;text-align:center;background:linear-gradient(135deg,#2E6BE6,#22B8CF);color:#fff;font-weight:700;
  font-size:13px;padding:11px 10px;border-radius:10px}
.note{font-size:10px;color:#93a3d0;margin-top:7px;line-height:1.2;text-align:center}
</style></head>
<body>
<div class="ad">
  <div class="eyebrow">Плохая КИ → ипотека</div>
  <div class="h">Отказывают, хотя долгов уже нет?</div>
  <div class="stage">
    <div class="lbl"><span>Рейтинг сейчас</span><b>зона отказов</b></div>
    <div class="track"><div class="fill-bad"></div></div>
    <div class="arrow">&darr;</div>
    <div class="lbl"><span>После работы</span><b>зона одобрения</b></div>
    <div class="track"><div class="fill-good"></div></div>
    <span class="tag">ориентировочно · +150–400 баллов</span>
  </div>
  <div class="guar">Законно поднимаем рейтинг за 6–9 мес. <b>или возврат 100% стоимости</b>.</div>
  <div class="cta">Записаться на разбор</div>
  <div class="note">Решение по ипотеке принимает банк. Результат индивидуален.</div>
</div>
</body></html>
