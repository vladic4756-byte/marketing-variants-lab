<!doctype html>
<!-- banner:bfl-03-pristavy 728x90 · СВОБОДА · концепт «крупная строка-оффер + CTA» -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СВОБОДА 728x90</title>
<style>
  html,body{margin:0;width:728px;height:90px;overflow:hidden}
  *{box-sizing:border-box}
  .ad{
    position:relative;width:728px;height:90px;overflow:hidden;display:flex;align-items:center;gap:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;padding:0 20px;
    background:
      radial-gradient(60% 160% at 12% 50%, rgba(242,153,74,.34), rgba(242,153,74,0) 60%),
      linear-gradient(100deg,#143f39,#0e2d29 70%,#0a2320);
  }
  .brand{display:flex;align-items:center;gap:.4rem;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f7b267;flex:0 0 auto}
  .brand b{width:20px;height:20px;border-radius:6px;background:linear-gradient(150deg,#f7b267,#F2994A);color:#5a2f0c;display:grid;place-items:center;font-size:12px}
  .mid{flex:1;min-width:0}
  h1{font-size:17px;line-height:1.1;font-weight:800;margin:0;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h1 .hl{color:#f7b267}
  .sub{font-size:10.5px;color:#c7ddd6;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cta{flex:0 0 auto;background:linear-gradient(150deg,#f7b267,#F2994A);color:#3a1e05;font-weight:800;font-size:13px;text-align:center;border-radius:9px;padding:11px 16px;white-space:nowrap}
  .foot{position:absolute;left:20px;bottom:4px;font-size:6.5px;line-height:1.2;color:#7f9a92;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="ad">
  <div class="brand"><b>С</b><span>СВОБОДА</span></div>
  <div class="mid">
    <h1>Удержания приставов — <span class="hl">можно остановить</span></h1>
    <p class="sub">С введением процедуры банкротства удержания прекращаются, аресты снимаются.</p>
  </div>
  <div class="cta">Узнать по ситуации</div>
  <div class="foot">Реклама услуг банкротства физлиц. Ст. 28.1 ФЗ «О рекламе». Прекращение удержаний — после введения процедуры судом (ст. 213.11 ФЗ-127), не мгновенно.</div>
</div>
</body>
</html>
