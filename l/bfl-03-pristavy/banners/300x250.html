<!doctype html>
<!-- banner:bfl-03-pristavy 300x250 · СВОБОДА · концепт «до→после» (transformation) -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СВОБОДА 300x250</title>
<style>
  html,body{margin:0;width:300px;height:250px;overflow:hidden}
  *{box-sizing:border-box}
  .ad{
    position:relative;width:300px;height:250px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff;padding:16px 16px 14px;
    background:
      radial-gradient(120% 80% at 88% -10%, rgba(242,153,74,.4), rgba(242,153,74,0) 50%),
      linear-gradient(160deg,#143f39,#0e2d29 70%,#0a2320);
  }
  .brand{display:flex;align-items:center;gap:.4rem;font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#f7b267}
  .brand b{width:16px;height:16px;border-radius:5px;background:linear-gradient(150deg,#f7b267,#F2994A);color:#5a2f0c;display:grid;place-items:center;font-size:10px}
  .flow{display:flex;align-items:stretch;gap:8px;margin-top:14px}
  .box{flex:1;border-radius:10px;padding:9px 8px;font-size:11px;line-height:1.25;font-weight:600}
  .box small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
  .b-was{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#d6e6e1}
  .b-was b{color:#f7b267}
  .b-now{background:rgba(47,158,111,.22);border:1px solid rgba(47,158,111,.5)}
  .b-now .chk{color:#7fe3b6}
  .arr{align-self:center;font-size:16px;color:#F2994A;flex:0 0 auto}
  .cta{position:absolute;left:16px;right:16px;bottom:34px;background:linear-gradient(150deg,#f7b267,#F2994A);color:#3a1e05;font-weight:800;font-size:12.5px;text-align:center;border-radius:9px;padding:9px 6px}
  .foot{position:absolute;left:16px;right:16px;bottom:9px;font-size:7px;line-height:1.3;color:#8fa9a2}
</style>
</head>
<body>
<div class="ad">
  <div class="brand"><b>С</b> СВОБОДА</div>
  <div class="flow">
    <div class="box b-was"><small>Сейчас</small>Приставы <b>удерживают</b> из зарплаты, счёт арестован</div>
    <div class="arr" aria-hidden="true">→</div>
    <div class="box b-now"><small>После процедуры</small><span class="chk">Удержания стоп, аресты сняты</span></div>
  </div>
  <div class="cta">Узнать по своей ситуации</div>
  <div class="foot">Реклама услуг банкротства физлиц. Ст. 28.1 ФЗ «О рекламе». Прекращение удержаний — после введения процедуры судом (ст. 213.11 ФЗ-127), не мгновенно.</div>
</div>
</body>
</html>
