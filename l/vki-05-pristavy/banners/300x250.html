<!doctype html>
<!-- 300x250 · РЕЙТУМ · концепция: ДО→ПОСЛЕ (производство «висит» → окончено по ст.47, рейтинг растёт) -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden}
.b{width:300px;height:250px;position:relative;overflow:hidden;font-family:'Manrope',system-ui,Segoe UI,Arial,sans-serif;
  background:linear-gradient(155deg,#1B1410 0%,#7A2E0C 130%);color:#fff;padding:12px 13px 11px;display:flex;flex-direction:column}
.tag{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#FFC49A}
.h{font-size:15px;font-weight:800;line-height:1.14;margin-top:4px}
.h b{color:#FFB27A}
.row{display:flex;align-items:center;gap:6px;margin-top:10px}
.chip{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 7px}
.chip .s{font-size:10px;font-weight:800;color:#E7C9B6;text-transform:uppercase;letter-spacing:.02em}
.chip .v{font-size:11px;font-weight:700;margin-top:1px;line-height:1.1}
.chip--after{background:rgba(14,122,85,.22);border-color:rgba(143,211,176,.5)}
.chip--after .v{color:#B6F0D3}
.arrow{flex:none;font-size:14px;color:#FFB27A;font-weight:800}
.cta{margin-top:auto;background:linear-gradient(180deg,#F97316,#C2410C);border-radius:999px;text-align:center;
  font-size:13px;font-weight:800;padding:9px;color:#fff}
.fine{font-size:10px;color:#D9C3B4;margin-top:6px;line-height:1.2}
</style></head>
<body>
<div class="b">
  <div class="tag">Долг закрыли — а рейтинг?</div>
  <div class="h">Производство «висит» и <b>тянет рейтинг вниз</b></div>
  <div class="row">
    <div class="chip"><div class="s">Сейчас</div><div class="v">отказы банков</div></div>
    <div class="arrow">→</div>
    <div class="chip chip--after"><div class="s">По ст.47</div><div class="v">рост рейтинга</div></div>
  </div>
  <div class="cta">Пройти проверку за 5 шагов</div>
  <div class="fine">РЕЙТУМ · по договору. Окончание ИП не гарантируется.</div>
</div>
</body></html>
