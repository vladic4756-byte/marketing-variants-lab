<!doctype html>

<html lang="ru"><head><meta charset="utf-8"/>
<style>
  :root{--graphite:#1F2733;--steel:#2C3E50;--orange:#EA580C;--ink:#141A22}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:300px;height:250px}

  h1 b{color:#F97316}
  .sub{font-size:11.5px;color:#c6cedb;margin-top:7px;line-height:1.3}
  .cta{margin-top:auto;background:#EA580C;color:#fff;font-weight:700;font-size:13px;text-align:center;
       padding:10px;border-radius:7px}
  .disc{font-size:8px;color:#8794a6;margin-top:7px;line-height:1.25}
</style></head>
<body>
  <div class="b">
    <div class="brand"><span class="mark">Р</span><span>РЕЙТУМ</span></div>
    <span class="st47">ЗАКРЫТИЕ ИП ПО СТ.47</span>

    <div class="sub">Закроем по ст.47 и поднимем рейтинг <b style="color:#FDBA74">+150–400</b> за 6–9 мес по договору</div>

    <div class="disc">При выполнении рекомендаций или возврат стоимости. Окончание конкретного ИП не гарантируется. Реклама. Есть ИНН/ОГРН.</div>
  </div>
</body></html>
