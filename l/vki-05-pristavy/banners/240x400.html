<!doctype html>
<!-- 240x400 · РЕЙТУМ · концепция: ЧЕК-ЛИСТ шагов мастера (визуальный степпер под архетип) -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:240px;height:400px;overflow:hidden}
.b{width:240px;height:400px;position:relative;overflow:hidden;font-family:'Manrope',system-ui,Segoe UI,Arial,sans-serif;
  background:#F7F3EF;color:#1B1410;padding:16px 15px 14px;display:flex;flex-direction:column}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#9A3412;
  background:#FFE3D2;border:1px solid #FFD0B0;border-radius:999px;padding:4px 9px;align-self:flex-start}
.h{font-size:17px;font-weight:800;line-height:1.15;margin-top:11px}
.h b{background:linear-gradient(180deg,transparent 62%,#FFD9C2 62%)}
.steps{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:#4B4038}
.n{width:21px;height:21px;flex:none;border-radius:50%;background:#fff;border:2px solid #EA580C;color:#EA580C;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.step--done .n{background:#EA580C;color:#fff}
.step--done{color:#1B1410}
.cta{margin-top:auto;background:linear-gradient(180deg,#F97316,#C2410C);border-radius:999px;text-align:center;
  font-size:13px;font-weight:800;padding:10px;color:#fff}
.fine{font-size:10px;color:#8A7E74;margin-top:8px;line-height:1.2}
</style></head>
<body>
<div class="b">
  <span class="tag">РЕЙТУМ · приставы</span>
  <div class="h">Вырастет ли <b>рейтинг после приставов?</b></div>
  <div class="steps">
    <div class="step step--done"><span class="n">1</span>Ситуация с долгом</div>
    <div class="step step--done"><span class="n">2</span>Статус производств</div>
    <div class="step"><span class="n">3</span>Ваша цель</div>
    <div class="step"><span class="n">4</span>Прогноз по рейтингу</div>
    <div class="step"><span class="n">5</span>План по ст.47</div>
  </div>
  <div class="cta">Начать проверку →</div>
  <div class="fine">По договору: +150–400 баллов за 6–9 мес или возврат. Окончание ИП не гарантируется.</div>
</div>
</body></html>
