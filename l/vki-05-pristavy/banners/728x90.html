<!doctype html>
<!-- 728x90 · РЕЙТУМ · концепция: КРУПНАЯ ЦИФРА-ОФФЕР (вход по ст.47 от 9 900 ₽) + короткий хук -->
<html lang="ru"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden}
.b{width:728px;height:90px;position:relative;overflow:hidden;font-family:'Manrope',system-ui,Segoe UI,Arial,sans-serif;
  background:linear-gradient(120deg,#1B1410 0%,#7A2E0C 100%);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px}
.num{flex:none;text-align:center;line-height:1}
.num .from{font-size:10px;font-weight:800;color:#FFC49A;text-transform:uppercase;letter-spacing:.06em}
.num .big{font-size:34px;font-weight:800;color:#FFB27A}
.num .cur{font-size:11px;font-weight:700;color:#E7C9B6;margin-top:2px}
.txt{flex:1;min-width:0}
.txt .h{font-size:17px;font-weight:800;line-height:1.12}
.txt .h b{color:#FFB27A}
.txt .s{font-size:11px;font-weight:600;color:#E7C9B6;margin-top:3px;line-height:1.2}
.cta{flex:none;background:linear-gradient(180deg,#F97316,#C2410C);border-radius:999px;
  font-size:13px;font-weight:800;padding:11px 18px;color:#fff;white-space:nowrap}
.fine{position:absolute;left:20px;bottom:4px;font-size:10px;color:#C9AF9E}
</style></head>
<body>
<div class="b">
  <div class="num"><div class="from">Вход по ст.47</div><div class="big">9 900</div><div class="cur">₽, по договору</div></div>
  <div class="txt">
    <div class="h">Долг приставам закрыли, а <b>рейтинг стоит?</b></div>
    <div class="s">Разберём основание окончания ИП и посчитаем прогноз роста — за 5 шагов</div>
  </div>
  <div class="cta">Пройти проверку →</div>
  <div class="fine">РЕЙТУМ · окончание ИП зависит от решения ФССП, не гарантируется.</div>
</div>
</body></html>
