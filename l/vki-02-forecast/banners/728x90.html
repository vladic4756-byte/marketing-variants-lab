<!doctype html>
<!-- banner:vki-02-forecast · 728x90 (leaderboard) · БАЛЛ+ · угол «узнай свой балл». Самодостаточный HTML/SVG мокап. -->
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>БАЛЛ+ 728×90</title>
<style>
  html,body{margin:0}
  .ad{width:728px;height:90px;position:relative;overflow:hidden;border-radius:12px;display:flex;align-items:center;
    font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#08251B;
    background:linear-gradient(90deg,#ECFDF5 0%,#DFF6EA 60%,#D6F5E6 100%);border:1px solid #CFE9DC}
  .ad *{box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px;color:#064E3B;padding:0 16px;letter-spacing:-.02em;flex:0 0 auto}
  .mark{width:28px;height:26px;border-radius:7px;background:#064E3B;color:#34D399;display:grid;place-items:center;font-size:14px;font-weight:800}
  .gauge{width:120px;flex:0 0 auto}
  .txt{flex:1 1 auto;padding:0 12px}
  .h{font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
  .h b{color:#059669}
  .sub{font-size:12px;color:#284A3E;margin-top:3px}
  .cta{flex:0 0 auto;margin:0 16px;height:44px;padding:0 20px;border-radius:10px;background:#059669;color:#fff;
    display:flex;align-items:center;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 6px 16px -6px rgba(5,150,105,.5)}
</style>
</head>
<body>
<div class="ad" role="img" aria-label="БАЛЛ+ — узнайте свой кредитный балл и прогноз роста под ипотеку">
  <div class="brand"><span class="mark">Б+</span>БАЛЛ+</div>
  <svg class="gauge" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626"/><stop offset=".4" stop-color="#F59E0B"/>
      <stop offset=".7" stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/>
    </linearGradient></defs>
    <path d="M25 175 A135 135 0 0 1 295 175" fill="none" stroke="#CFE9DC" stroke-width="26" stroke-linecap="round"/>
    <path d="M25 175 A135 135 0 0 1 250 92" fill="none" stroke="url(#g3)" stroke-width="26" stroke-linecap="round"/>
    <text x="160" y="152" text-anchor="middle" font-size="58" font-weight="800" fill="#08251B" font-family="Segoe UI,Arial">700</text>
  </svg>
  <div class="txt">
    <div class="h">Узнайте свой <b>кредитный балл</b> и прогноз роста</div>
    <div class="sub">Отказ в ипотеке из-за просрочки? Калькулятор за 5 вопросов. Законно, по договору.</div>
  </div>
  <div class="cta">Узнать балл →</div>
</div>
</body>
</html>
