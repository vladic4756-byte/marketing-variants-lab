<!doctype html>
<!-- banner:vki-02-forecast · 728x90 (leaderboard) · БАЛЛ+ · КОНЦЕПЦИЯ: горизонтальный метр + оффер-CTA. Самодостаточный HTML/SVG. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>БАЛЛ+ 728x90</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:728px;height:90px;overflow:hidden}
.b{width:728px;height:90px;overflow:hidden;font-family:'Segoe UI',Roboto,Arial,sans-serif;
  background:radial-gradient(120% 200% at 100% 0%,#0B3B2F,#0E1726);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px}
.br{font-weight:800;font-size:17px;flex:none}.br b{color:#34D399}
.txt{flex:none;width:210px}
.h{font-weight:800;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.h u{color:#5EEAD4;text-decoration:none}
.mid{flex:1;min-width:130px}
.cap{font-size:10px;letter-spacing:.02em;color:#8FD9C0;font-weight:700;margin-bottom:4px}
.mrow{display:flex;align-items:center;gap:9px}
.num{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:18px;color:#fff;flex:none}
.track{position:relative;flex:1;height:10px;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,#F87171,#FBBF24 46%,#34D399)}
.mk{position:absolute;top:-2px;width:10px;height:14px}
.mk::after{content:'';position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #0B3B2F}
.mk2::after{border-color:#059669}
.dl{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px;color:#5EEAD4;flex:none}
.fine{font-size:10px;color:#7FCBB6;margin-top:5px}
.cta{flex:none;background:linear-gradient(135deg,#10B981,#059669);color:#fff;font-weight:800;font-size:13px;
  border-radius:9px;padding:11px 15px;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(5,150,105,.9)}
</style></head>
<body>
<div class="b">
  <div class="br">БАЛЛ<b>+</b></div>
  <div class="txt"><div class="h">Отказ в ипотеке из-за <u>кредитной истории</u>?</div></div>
  <div class="mid">
    <div class="cap">Прогноз балла · ориентировочно</div>
    <div class="mrow">
      <span class="num">480→720</span>
      <span class="track"><span class="mk" style="left:33%"></span><span class="mk mk2" style="left:76%"></span></span>
      <span class="dl">+150–400</span>
    </div>
    <div class="fine">за 6–9 мес или возврат · по договору</div>
  </div>
  <div class="cta">Узнать балл →</div>
</div>
</body></html>
