<!doctype html>
<!-- banner:vki-02-forecast · 300x250 (medium rectangle) · БАЛЛ+ · КОНЦЕПЦИЯ: тизер-калькулятор (живой метр балла). Самодостаточный HTML/SVG. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>БАЛЛ+ 300x250</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:300px;height:250px;overflow:hidden}
.b{width:300px;height:250px;position:relative;overflow:hidden;font-family:'Segoe UI',Roboto,Arial,sans-serif;
  background:radial-gradient(120% 90% at 90% 0%,#0B3B2F,#0E1726);color:#fff;padding:16px 16px 14px;display:flex;flex-direction:column}
.br{font-weight:800;font-size:13px;letter-spacing:.02em;color:#EAFBF3}
.br b{color:#34D399}
.h{font-weight:800;font-size:16px;line-height:1.18;margin:7px 0 2px;letter-spacing:-.01em}
.h u{color:#5EEAD4;text-decoration:none}
.cap{font-size:10px;color:#8FD9C0;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-top:9px}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.num{font-family:ui-monospace,'Cascadia Mono',Menlo,monospace;font-weight:800;font-size:34px;line-height:.9;color:#fff}
.dl{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;color:#5EEAD4;padding-bottom:4px}
.track{position:relative;height:12px;border-radius:99px;margin-top:9px;overflow:hidden;
  background:linear-gradient(90deg,#F87171,#FBBF24 46%,#34D399)}
.mk{position:absolute;top:-3px;width:12px;height:18px}
.mk::after{content:'';position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #0B3B2F;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.mk2::after{border-color:#059669}
.cta{margin-top:auto;background:linear-gradient(135deg,#10B981,#059669);color:#fff;font-weight:800;font-size:13px;
  text-align:center;border-radius:10px;padding:10px;box-shadow:0 6px 14px -6px rgba(5,150,105,.9)}
.fine{font-size:10px;color:#7FCBB6;text-align:center;margin-top:6px;line-height:1.3}
</style></head>
<body>
<div class="b">
  <div class="br">БАЛЛ<b>+</b></div>
  <div class="h">Узнайте свой <u>кредитный балл</u> — и рост под ипотеку</div>
  <div class="cap">Прогноз за 2 минуты</div>
  <div class="row"><div class="num">480→720</div><div class="dl">ориентир.</div></div>
  <div class="track"><div class="mk" style="left:33%"></div><div class="mk mk2" style="left:76%"></div></div>
  <div class="cta">Рассчитать мой прогноз →</div>
  <div class="fine">+150–400 баллов за 6–9 мес или возврат · по договору</div>
</div>
</body></html>
