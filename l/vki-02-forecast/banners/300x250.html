<!doctype html>
<!-- banner:vki-02-forecast · 300x250 (medium rectangle) · БАЛЛ+ · угол «узнай свой балл». Самодостаточный HTML/SVG мокап. -->
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>БАЛЛ+ 300×250</title>
<style>
  html,body{margin:0}
  .ad{width:300px;height:250px;position:relative;overflow:hidden;border-radius:14px;
    font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#08251B;
    background:linear-gradient(160deg,#ECFDF5 0%,#D6F5E6 100%);border:1px solid #CFE9DC}
  .ad *{box-sizing:border-box}
  .brand{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:#064E3B;letter-spacing:-.02em}
  .mark{width:24px;height:22px;border-radius:6px;background:#064E3B;color:#34D399;display:grid;place-items:center;font-size:12px;font-weight:800}
  .h{position:absolute;top:44px;left:14px;right:14px;font-size:18px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
  .h b{color:#059669}
  .gauge{position:absolute;left:14px;top:118px;width:120px}
  .sub{position:absolute;left:140px;top:120px;right:14px;font-size:12px;color:#284A3E;line-height:1.35}
  .cta{position:absolute;left:14px;bottom:14px;right:14px;height:40px;border-radius:10px;background:#059669;color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;box-shadow:0 6px 16px -6px rgba(5,150,105,.5)}
  .fine{position:absolute;left:14px;bottom:58px;font-size:8px;color:#5b7268}
</style>
</head>
<body>
<div class="ad" role="img" aria-label="БАЛЛ+ — узнайте свой кредитный балл и прогноз роста под ипотеку">
  <div class="brand"><span class="mark">Б+</span>БАЛЛ+</div>
  <div class="h">Узнайте свой <b>кредитный балл</b></div>
  <svg class="gauge" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC2626"/><stop offset=".4" stop-color="#F59E0B"/>
      <stop offset=".7" stop-color="#22C55E"/><stop offset="1" stop-color="#059669"/>
    </linearGradient></defs>
    <path d="M25 175 A135 135 0 0 1 295 175" fill="none" stroke="#CFE9DC" stroke-width="24" stroke-linecap="round"/>
    <path d="M25 175 A135 135 0 0 1 250 92" fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round"/>
    <text x="160" y="150" text-anchor="middle" font-size="52" font-weight="800" fill="#08251B" font-family="Segoe UI,Arial">700</text>
  </svg>
  <div class="sub">и на сколько он вырастет под ипотеку.<br>Калькулятор за 5 вопросов.</div>
  <div class="fine">Гарантия при выполнении рекомендаций</div>
  <div class="cta">Узнать балл →</div>
</div>
</body>
</html>
