<!doctype html>
<!-- banner:vki-02-forecast · 240x400 (vertical) · БАЛЛ+ · КОНЦЕПЦИЯ: до→после (крупная дельта балла). Самодостаточный HTML/SVG. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>БАЛЛ+ 240x400</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:240px;height:400px;overflow:hidden}
.b{width:240px;height:400px;position:relative;overflow:hidden;font-family:'Segoe UI',Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#EAFBF2,#fff 55%);color:#0E1726;padding:18px 16px 16px;display:flex;flex-direction:column}
.br{font-weight:800;font-size:14px;color:#0E1726}.br b{color:#059669}
.h{font-weight:800;font-size:17px;line-height:1.2;margin:8px 0 0;letter-spacing:-.01em}
.h u{color:#047857;text-decoration:none}
.wrapd{margin:14px 0 0;background:#fff;border:1px solid #D8F5E6;border-radius:14px;padding:14px 12px;box-shadow:0 8px 20px -12px rgba(5,150,105,.4)}
.st{display:flex;align-items:center;justify-content:space-between}
.col{text-align:center;flex:1}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:#697588;font-weight:700}
.v{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:30px;line-height:1;margin-top:3px}
.v.bad{color:#E11D48}.v.good{color:#059669}
.arr{font-size:22px;color:#059669;font-weight:800;padding:0 2px}
.delta{margin-top:10px;text-align:center;background:#059669;color:#fff;border-radius:99px;font-weight:800;font-size:13px;padding:6px 8px}
.delta span{font-weight:600;font-size:10px;opacity:.85}
.li{font-size:11px;color:#39445A;margin-top:9px;padding-left:16px;position:relative;line-height:1.35}
.li::before{content:'✓';position:absolute;left:0;color:#059669;font-weight:800}
.cta{margin-top:auto;background:linear-gradient(135deg,#10B981,#059669);color:#fff;font-weight:800;font-size:14px;
  text-align:center;border-radius:11px;padding:12px;box-shadow:0 8px 16px -6px rgba(5,150,105,.8)}
.fine{font-size:10px;color:#697588;text-align:center;margin-top:8px;line-height:1.3}
</style></head>
<body>
<div class="b">
  <div class="br">БАЛЛ<b>+</b></div>
  <div class="h">Просрочку закрыли, а в <u>ипотеке отказ</u>?</div>
  <div class="wrapd">
    <div class="st">
      <div class="col"><div class="lbl">сейчас</div><div class="v bad">480</div></div>
      <div class="arr">→</div>
      <div class="col"><div class="lbl">прогноз</div><div class="v good">720</div></div>
    </div>
    <div class="delta">+150–400 баллов <span>/ ориентировочно</span></div>
  </div>
  <div class="li">Законно: исправляем ошибки в бюро</div>
  <div class="li">Деньги не идут вам на руки</div>
  <div class="li">За 6–9 мес или возврат стоимости</div>
  <div class="cta">Узнать свой прогноз →</div>
  <div class="fine">По договору · решение по ипотеке — за банком</div>
</div>
</body></html>
